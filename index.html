<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart To-Do List</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background:#f4f6f9; }

.sidebar {
    background:#1e293b;
    min-height:100vh;
    color:white;
    padding:20px;
}

.priority-high { border-left:5px solid #dc3545; }
.priority-medium { border-left:5px solid #ffc107; }
.priority-low { border-left:5px solid #198754; }

.completed { text-decoration:line-through; opacity:0.6; }

.task-card { border-radius:10px; margin-bottom:10px; }
</style>
</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->
<div class="col-md-3 sidebar">
    <h4>🔎 Search</h4>
    <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search...">

    <select id="filterSelect" class="form-select mb-3">
        <option value="all">All</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
    </select>

    <button class="btn btn-info w-100 mb-3" data-bs-toggle="modal" data-bs-target="#dashboardModal" onclick="loadChart()">
        📊 Dashboard
    </button>

    <hr>

    <h5>Task Summary</h5>
    <p>Total: <span id="totalCount">0</span></p>
    <p>Completed: <span id="completedCount">0</span></p>
    <p>Pending: <span id="pendingCount">0</span></p>
</div>

<!-- MAIN -->
<div class="col-md-9 p-4">

<h3>📝 Smart To-Do Pro</h3>

<div class="row g-2 mb-3">
    <div class="col-md-4">
        <input type="text" id="taskInput" class="form-control" placeholder="Task">
    </div>
    <div class="col-md-3">
        <select id="prioritySelect" class="form-select">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
        </select>
    </div>
    <div class="col-md-3">
        <input type="datetime-local" id="dueDate" class="form-control">
    </div>
    <div class="col-md-2">
        <button class="btn btn-primary w-100" onclick="addTask()">Add</button>
    </div>
</div>

<div id="taskList"></div>

</div>
</div>
</div>

<!-- DASHBOARD MODAL -->
<div class="modal fade" id="dashboardModal">
<div class="modal-dialog modal-lg">
<div class="modal-content">
<div class="modal-header">
    <h5 class="modal-title">📊 Dashboard Analytics</h5>
    <button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <canvas id="taskChart"></canvas>
</div>
</div>
</div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let chartInstance = null;

function saveLocal(){
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask(){
    const text = taskInput.value.trim();
    if(text === "") return;

    tasks.push({
        id: Date.now(),
        text,
        priority: prioritySelect.value,
        dueDate: dueDate.value,
        completed:false,
        reminded:false
    });

    taskInput.value="";
    renderTasks();
}

function renderTasks(){

    const priorityOrder = {high:1, medium:2, low:3};
    tasks.sort((a,b)=>priorityOrder[a.priority]-priorityOrder[b.priority]);

    const search = searchInput.value.toLowerCase();
    const filter = filterSelect.value;

    taskList.innerHTML="";

    tasks.forEach(task=>{

        if(!task.text.toLowerCase().includes(search)) return;
        if(filter==="completed" && !task.completed) return;
        if(filter==="pending" && task.completed) return;

        const card=document.createElement("div");
        card.className=`card p-3 task-card priority-${task.priority}`;

        const title=document.createElement("h6");
        title.textContent=task.text;
        if(task.completed) title.classList.add("completed");

        title.onclick=()=>{
            task.completed=!task.completed;
            saveLocal();
            renderTasks();
        };

        const date=document.createElement("small");
        date.textContent=task.dueDate ? "Due: "+new Date(task.dueDate).toLocaleString():"";

        const delBtn=document.createElement("button");
        delBtn.className="btn btn-sm btn-danger mt-2";
        delBtn.textContent="Delete";
        delBtn.onclick=()=>{
            tasks=tasks.filter(t=>t.id!==task.id);
            saveLocal();
            renderTasks();
        };

        card.appendChild(title);
        card.appendChild(date);
        card.appendChild(delBtn);

        taskList.appendChild(card);
    });

    totalCount.textContent=tasks.length;
    completedCount.textContent=tasks.filter(t=>t.completed).length;
    pendingCount.textContent=tasks.filter(t=>!t.completed).length;

    saveLocal();
}

function checkReminders(){
    const now=new Date().getTime();

    tasks.forEach(task=>{
        if(task.dueDate && !task.reminded){
            const due=new Date(task.dueDate).getTime();
            if(now>=due){
                showNotification(task.text);
                task.reminded=true;
                saveLocal();
            }
        }
    });
}

function showNotification(message){
    if(Notification.permission==="granted"){
        new Notification("⏰ Task Reminder",{ body: message });
    } else if(Notification.permission!=="denied"){
        Notification.requestPermission();
    }
}

function loadChart(){

    const completed=tasks.filter(t=>t.completed).length;
    const pending=tasks.filter(t=>!t.completed).length;

    const ctx=document.getElementById("taskChart");

    if(chartInstance) chartInstance.destroy();

    chartInstance=new Chart(ctx,{
        type:"doughnut",
        data:{
            labels:["Completed","Pending"],
            datasets:[{
                data:[completed,pending]
            }]
        }
    });
}

searchInput.addEventListener("input",renderTasks);
filterSelect.addEventListener("change",renderTasks);

setInterval(checkReminders,60000);

renderTasks();

</script>

</body>
</html>
